name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-portfolio-service:
    name: Build Portfolio Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-portfolio-${{ hashFiles('portfolio-service/pom.xml') }}
      - name: Build Portfolio Service
        run: |
          cd portfolio-service
          chmod +x mvnw
          ./mvnw clean compile -DskipTests

  build-risk-engine:
    name: Build Risk Engine Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-risk-${{ hashFiles('risk-engine-service/pom.xml') }}
      - name: Build Risk Engine Service
        run: |
          cd risk-engine-service
          chmod +x mvnw
          ./mvnw clean compile -DskipTests

  build-notification-service:
    name: Build Notification Service
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-notification-${{ hashFiles('notification-service/pom.xml') }}
      - name: Build Notification Service
        run: |
          cd notification-service
          chmod +x mvnw
          ./mvnw clean compile -DskipTests

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          cd frontend
          npm ci
      - name: Build Frontend
        run: |
          cd frontend
          npm run build