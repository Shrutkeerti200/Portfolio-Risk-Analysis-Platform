server:
    port: ${PORT:8081}

spring:
    application:
        name: portfolio-service

    # PostgreSQL — works with both local and Neon
    datasource:
        url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/portfolio_db}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver

    # JPA / Hibernate Configuration
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: false
        open-in-view: false
        properties:
            hibernate:
                "[format_sql]": true
                dialect: org.hibernate.dialect.PostgreSQLDialect

    # Redis — works with both local and Upstash
    data:
        redis:
            url: ${REDIS_URL:redis://localhost:6379}

    mail:
        host: smtp.gmail.com
        port: 587
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true

app:
    otp:
        expiration: 300000

# JWT Configuration
jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000

# Actuator - Health endpoints
management:
    endpoints:
        web:
            exposure:
                include: health,info

anthropic:
    api-key: ${ANTHROPIC_API_KEY:none}

gemini:
    api-key: ${GEMINI_API_KEY:none}

groq:
    api-key: ${GROQ_API_KEY:none}