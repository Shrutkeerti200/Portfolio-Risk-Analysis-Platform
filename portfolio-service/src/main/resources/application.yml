server:
    port: 8081

spring:
    application:
        name: portfolio-service

    # PostgreSQL Configuration
    datasource:
        url: jdbc:postgresql://localhost:5433/portfolio_db
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: org.postgresql.Driver

    # JPA / Hibernate Configuration
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        open-in-view: false
        properties:
            hibernate:
                "[format_sql]": true

    # Redis Configuration
    data:
        redis:
            host: localhost
            port: 6379

    mail:
        host: smtp.gmail.com
        port: 587
        username: ${MAIL_USERNAME}
        password: ${MAIL_PASSWORD}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true

app:
    otp:
        expiration: 300000 # 5 minutes in milliseconds
            
# JWT Configuration
jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000 # 1 day in milliseconds

#actuator - Health endpoints
management:
    endpoints:
        web:
            exposure:
                include: health,info 